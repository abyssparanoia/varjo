<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="varjo logo: a purple shadow sprite with a terminal-prompt face">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b1038"/>
      <stop offset="1" stop-color="#090513"/>
    </linearGradient>
    <linearGradient id="body" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#5a46a4"/>
      <stop offset="1" stop-color="#241a50"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- badge: dark gradient with a violet rim so the mark stays visible on dark pages -->
  <rect x="14" y="14" width="484" height="484" rx="116" fill="url(#bg)" stroke="#8b5cf6" stroke-opacity="0.65" stroke-width="4"/>
  <ellipse cx="256" cy="310" rx="190" ry="160" fill="url(#aura)"/>

  <!-- the shadow behind the sprite (varjo = shadow) -->
  <path transform="translate(26 22)" opacity="0.35"
        d="M256 118 C 150 118 120 206 120 282 L 120 392 Q 154 420 188 392 Q 222 420 256 392 Q 290 420 324 392 Q 358 420 392 392 L 392 282 C 392 206 362 118 256 118 Z"
        fill="#0b0618"/>

  <!-- sprite body -->
  <path d="M256 118 C 150 118 120 206 120 282 L 120 392 Q 154 420 188 392 Q 222 420 256 392 Q 290 420 324 392 Q 358 420 392 392 L 392 282 C 392 206 362 118 256 118 Z"
        fill="url(#body)" stroke="#a78bfa" stroke-opacity="0.9" stroke-width="3.5"/>
  <!-- rim light -->
  <path d="M 252 118 C 150 118 120 206 120 282" fill="none" stroke="#d8ccff" stroke-width="6" stroke-linecap="round" opacity="0.75"/>

  <!-- face: a terminal prompt  > _  -->
  <g fill="none" stroke="#efe6ff" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 188 232 L 226 268 L 188 304"/>
    <path d="M 268 304 L 330 304"/>
  </g>
</svg>
