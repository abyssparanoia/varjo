<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="varjo logo: a hooded shadow figure with glowing violet eyes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#160f30"/>
      <stop offset="1" stop-color="#05030c"/>
    </linearGradient>
    <linearGradient id="hood" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#4b37a0"/>
      <stop offset="0.45" stop-color="#2a1e60"/>
      <stop offset="1" stop-color="#130c30"/>
    </linearGradient>
    <linearGradient id="facet" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8f74f0"/>
      <stop offset="1" stop-color="#4a3796" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0" stop-color="#0b0620"/>
      <stop offset="0.3" stop-color="#030108"/>
      <stop offset="1" stop-color="#030108"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0e9ff"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="slash" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#a78bfa" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aura" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <filter id="eyeglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feFlood flood-color="#9b6bff" flood-opacity="0.95" result="c"/>
      <feComposite in="c" in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="haze" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <clipPath id="badge"><rect x="14" y="14" width="484" height="484" rx="80"/></clipPath>
  </defs>

  <rect x="14" y="14" width="484" height="484" rx="80" fill="url(#bg)"/>
  <g clip-path="url(#badge)">
    <!-- diagonal light slashes -->
    <g transform="rotate(-32 256 256)">
      <rect x="-80" y="150" width="680" height="3" fill="url(#slash)"/>
      <rect x="-80" y="196" width="680" height="7" fill="url(#slash)" opacity="0.7"/>
      <rect x="-80" y="330" width="680" height="2" fill="url(#slash)" opacity="0.6"/>
      <rect x="-80" y="372" width="680" height="5" fill="url(#slash)" opacity="0.45"/>
    </g>
    <ellipse cx="256" cy="270" rx="225" ry="215" fill="url(#aura)"/>

    <g transform="rotate(-4 256 300)">
      <!-- cast shadow -->
      <path transform="translate(38 12)" opacity="0.65" filter="url(#haze)"
            d="M28 520 C 48 408 86 332 124 286 L 104 296 L 150 254 C 158 168 198 110 270 86 C 318 118 348 176 358 244 L 400 282 L 382 288 C 428 346 468 420 484 520 Z" fill="#02010a"/>

      <!-- hood / cloak -->
      <path d="M28 520 C 48 408 86 332 124 286 L 104 296 L 150 254 C 158 168 198 110 270 86 C 318 118 348 176 358 244 L 400 282 L 382 288 C 428 346 468 420 484 520 Z"
            fill="url(#hood)" stroke="#bda8ff" stroke-opacity="0.85" stroke-width="3" stroke-linejoin="round"/>
      <!-- lit facet upper left -->
      <path d="M270 86 C 198 110 158 168 150 254 L 104 296 L 124 286 C 96 330 70 390 56 460 C 92 360 128 304 176 262 C 190 190 220 130 270 100 Z" fill="url(#facet)" opacity="0.9"/>
      <!-- angular folds -->
      <path d="M168 270 L 146 352 L 118 520" fill="none" stroke="#8469e6" stroke-opacity="0.5" stroke-width="2.5" stroke-linejoin="round"/>
      <path d="M344 262 L 372 350 L 404 520" fill="none" stroke="#8469e6" stroke-opacity="0.45" stroke-width="2.5" stroke-linejoin="round"/>

      <!-- face in darkness, pointed arch -->
      <path d="M200 214 L 226 166 L 262 232 L 298 162 L 322 214 C 334 250 336 280 334 312 L 338 420 L 256 492 L 174 420 L 178 312 C 178 280 184 246 200 214 Z" fill="url(#face)"/>
      <path d="M200 214 L 226 166 L 262 232 L 298 162 L 322 214 C 334 250 336 280 334 312 L 338 420 L 256 492 L 174 420 L 178 312 C 178 280 184 246 200 214 Z" fill="none" stroke="#c9b8ff" stroke-opacity="0.4" stroke-width="2"/>

      <!-- cloak edges crossing below the chin -->
      <path d="M140 520 L 256 492 L 338 420" fill="none" stroke="#bda8ff" stroke-opacity="0.65" stroke-width="3" stroke-linejoin="round"/>
      <path d="M372 520 L 256 492 L 174 420" fill="none" stroke="#bda8ff" stroke-opacity="0.65" stroke-width="3" stroke-linejoin="round"/>

      <!-- rim light -->
      <path d="M270 86 C 198 110 158 168 150 254 L 104 296" fill="none" stroke="url(#edge)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M270 86 C 318 118 348 176 358 244" fill="none" stroke="#b39dff" stroke-opacity="0.5" stroke-width="3" stroke-linecap="round"/>

      <!-- eyes: sharp inward-slanted slits -->
      <g fill="#ffffff" filter="url(#eyeglow)">
        <path d="M184 306 L 250 274 L 248 290 L 200 322 Z"/>
        <path d="M332 304 L 266 274 L 268 290 L 316 320 Z"/>
      </g>
    </g>
  </g>
  <rect x="14" y="14" width="484" height="484" rx="80" fill="none" stroke="#8b5cf6" stroke-opacity="0.7" stroke-width="4"/>
</svg>
